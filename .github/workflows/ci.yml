name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: pnpm lint

      - name: Test (jsdom)
        run: pnpm test

      - name: Test (browser)
        run: pnpm test:integration:browser

      - name: Build
        run: pnpm build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || (echo "❌ ESM build missing" && exit 1)
          test -f dist/index.umd.js || (echo "❌ UMD build missing" && exit 1)
          test -f dist/index.d.ts || (echo "❌ Types missing" && exit 1)
          echo "✅ All build artifacts present"
